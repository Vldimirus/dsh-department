<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Вариации</title>
<style>body{margin:0;background:#0b0f18;color:#e6edf7;font:14px system-ui;padding:16px}
.row{display:flex;flex-wrap:wrap;gap:12px}.card{background:#1a2233;border:1px solid #26324a;border-radius:10px;padding:8px;text-align:center}
img{image-rendering:pixelated}.name{font-size:11px;color:#8b98ad}</style></head><body>
<h1>10 вариантов</h1><div class="row" id="row"></div>
<script>
const ids=['manager-1','manager-2','coder-1','coder-2','tester-1','tester-2','reviewer-1','reviewer-2','analyst-1','artist-1'];
for(const id of ids){const c=document.createElement('div');c.className='card';
const i=document.createElement('img');i.src='char-'+id+'.png';i.width=120;i.height=240;c.append(i);
const n=document.createElement('div');n.className='name';n.textContent=id;c.append(n);document.getElementById('row').append(c);}
</script></body></html>
