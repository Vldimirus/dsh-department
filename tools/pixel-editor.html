<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Пиксель-редактор отдела</title>
<style>
  :root { --bg: #0b0f18; --panel: #141a28; --line: #26324a; --text: #e6edf7; --muted: #8b98ad; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--text); font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
  .wrap { display: grid; grid-template-columns: 280px minmax(0, 1fr); gap: 16px; padding: 16px; }
  .panel { background: var(--panel); border: 1px solid var(--line); border-radius: 12px; padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  h1 { font-size: 16px; margin: 0 0 4px; }
  .muted { color: var(--muted); font-size: 12px; }
  .row { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  button { background: #1b2438; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px; cursor: pointer; font-size: 13px; }
  button.active { border-color: #4b8bff; color: #cfe3ff; }
  button:hover { border-color: #3d4a63; }
  select, input[type="number"], input[type="color"] { background: #1b2438; color: var(--text); border: 1px solid var(--line); border-radius: 8px; padding: 4px 6px; }
  input[type="color"] { width: 42px; height: 32px; padding: 2px; }
  .swatches { display: grid; grid-template-columns: repeat(8, 1fr); gap: 4px; }
  .swatch { width: 100%; aspect-ratio: 1; border-radius: 4px; border: 1px solid #0008; cursor: pointer; }
  .swatch.active { outline: 2px solid #fff; }
  canvas { display: block; image-rendering: pixelated; background: #222; border-radius: 8px; cursor: crosshair; touch-action: none; }
  .canvas-wrap { background: #10151f; border: 1px solid var(--line); border-radius: 12px; padding: 12px; overflow: auto; display: flex; justify-content: center; }
  .status { font-size: 12px; color: var(--muted); }
  .hint { font-size: 11px; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <div class="panel">
    <h1>Пиксель-редактор</h1>
    <div class="muted">Рисуй спрайт, сохраняй PNG или JSON-сетку.</div>

    <div class="row">
      <label class="muted">Зум</label>
      <button id="zoomOut">−</button>
      <span class="muted" id="zoomLabel">8×</span>
      <button id="zoomIn">+</button>
      <button id="zoomFit">Вписать</button>
    </div>

    <div class="row">
      <label class="muted">Размер</label>
      <select id="size">
        <option value="16x16">16×16</option><option value="32x32" selected>32×32</option><option value="48x48">48×48</option><option value="64x64">64×64</option><option value="96x96">96×96</option><option value="16x48">16×48 персонаж</option><option value="32x64">32×64 персонаж</option>
      </select>
      <button id="gridToggle" class="active">Сетка</button>
    </div>

    <div class="row">
      <button id="pencil" class="active">Карандаш</button>
      <button id="eraser">Ластик</button>
      <button id="fill">Заливка</button>
      <button id="picker">Пипетка</button>
    </div>
    <div class="row">
      <button id="line">Линия</button>
      <button id="rect">Прямоуг.</button>
      <button id="circle">Круг</button>
      <button id="select">Выделение</button>
    </div>
    <div class="row">
      <label class="muted"><input type="checkbox" id="template"> шаблон персонажа</label>
    </div>
    <div class="row">
      <label class="muted"><input type="checkbox" id="filled"> залитый</label>
      <input type="color" id="color" value="#7fdc9a">
    </div>

    <div class="swatches" id="swatches"></div>

    <div class="row">
      <button id="copy">Копировать</button>
      <button id="cut">Вырезать</button>
      <button id="paste">Вставить</button>
      <button id="del">Удалить</button>
      <button id="deselect">Снять</button>
    </div>

    <div class="row">
      <button id="undo">Отменить</button>
      <button id="redo">Вернуть</button>
      <button id="savePng">PNG</button>
      <button id="saveJson">JSON</button>
      <button id="clear">Очистить</button>
    </div>

    <div class="status" id="status">32×32</div>
    <div class="hint">Ctrl+C / Ctrl+X / Ctrl+V, Delete — по выделению. Вставка ставится в левый верхний угол выделения.</div>
  </div>

  <div class="canvas-wrap"><canvas id="canvas"></canvas></div>
</div>

<script>
const PALETTE = [
  '#1b2434', '#2a3448', '#3a4560', '#5b6a90',
  '#8a5a2b', '#a8713a', '#c9b48c', '#d9c9a3',
  '#3f8a4f', '#4fa05e', '#7fdc9a', '#8fd3ff',
  '#4b8bff', '#9b7bff', '#c25a4a', '#f0c9a0'
];

const canvas = document.getElementById('canvas');
const ctx = canvas.getContext('2d');
let gridW = 32;
let gridH = 32;
let zoom = 12;
function fitZoom() {
  return Math.max(1, Math.min(32, Math.floor(520 / Math.max(gridW, gridH))));
}
function setZoom(value) {
  zoom = Math.max(1, Math.min(40, value));
  const label = document.getElementById('zoomLabel');
  if (label) label.textContent = zoom + '×';
  render();
}
let pixels = [];
let tool = 'pencil';
let color = '#7fdc9a';
let showGrid = true;
let undoStack = [];
let redoStack = [];
let drawing = false;
let startPoint = null;
let drawSnapshot = null;
let selection = null;
let clipboard = null;
let showTemplate = false;

function blank() {
  return Array.from({ length: gridH }, () => Array(gridW).fill(null));
}

function reset() {
  pixels = blank();
  setZoom(fitZoom());
  selection = null;
  undoStack = [];
  redoStack = [];
  render();
}

function snapshot() {
  undoStack.push(pixels.map((row) => row.slice()));
  if (undoStack.length > 80) undoStack.shift();
  redoStack = [];
}

function render() {
  canvas.width = gridW * zoom;
  canvas.height = gridH * zoom;
  ctx.imageSmoothingEnabled = false;
  ctx.fillStyle = '#222';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  for (let y = 0; y < gridH; y += 1) {
    for (let x = 0; x < gridW; x += 1) {
      const value = pixels[y][x];
      if (!value) continue;
      ctx.fillStyle = value;
      ctx.fillRect(x * zoom, y * zoom, zoom, zoom);
    }
  }
  if (showGrid && zoom >= 8) {
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.lineWidth = 1;
    for (let i = 0; i <= Math.max(gridW, gridH); i += 1) {
      ctx.beginPath(); ctx.moveTo(i * zoom + 0.5, 0); ctx.lineTo(i * zoom + 0.5, canvas.height); ctx.stroke();
      ctx.beginPath(); ctx.moveTo(0, i * zoom + 0.5); ctx.lineTo(canvas.width, i * zoom + 0.5); ctx.stroke();
    }
  }
  if (showTemplate) {
    const cx = Math.floor(gridW / 2);
    const bottom = gridH;
    const zones = [
      { x: cx - 8, y: bottom - 15, w: 16, h: 15, color: '#4b8bff33', label: 'ноги' },
      { x: cx - 8, y: bottom - 34, w: 16, h: 18, color: '#7fdc9a33', label: 'туловище' },
      { x: cx - 6, y: bottom - 45, w: 12, h: 12, color: '#f0c9a033', label: 'голова' },
      { x: cx - 7, y: bottom - 48, w: 14, h: 5, color: '#c25a4a33', label: 'волосы' },
    ];
    ctx.save();
    ctx.font = Math.max(9, zoom) + 'px sans-serif';
    for (const zone of zones) {
      ctx.fillStyle = zone.color;
      ctx.fillRect(zone.x * zoom, zone.y * zoom, zone.w * zoom, zone.h * zoom);
      ctx.strokeStyle = '#ffffff66';
      ctx.strokeRect(zone.x * zoom, zone.y * zoom, zone.w * zoom, zone.h * zoom);
      ctx.fillStyle = '#ffffffaa';
      ctx.fillText(zone.label, zone.x * zoom + 2, zone.y * zoom + Math.max(10, zoom) + 2);
    }
    ctx.restore();
  }
  if (selection) {
    const { x0, y0, x1, y1 } = normalized(selection);
    ctx.save();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.setLineDash([6, 4]);
    ctx.strokeRect(x0 * zoom + 1, y0 * zoom + 1, (x1 - x0 + 1) * zoom - 2, (y1 - y0 + 1) * zoom - 2);
    ctx.restore();
  }
  document.getElementById('status').textContent = gridW + '×' + gridH + ' · ' + tool + (selection ? ' · выделение' : '');
}

function normalized(sel) {
  return {
    x0: Math.min(sel.x0, sel.x1), y0: Math.min(sel.y0, sel.y1),
    x1: Math.max(sel.x0, sel.x1), y1: Math.max(sel.y0, sel.y1),
  };
}

function cell(event) {
  const rect = canvas.getBoundingClientRect();
  const x = Math.floor((event.clientX - rect.left) / zoom);
  const y = Math.floor((event.clientY - rect.top) / zoom);
  if (x < 0 || y < 0 || x >= gridW || y >= gridH) return null;
  return { x, y };
}

function put(x, y, value) {
  if (x < 0 || y < 0 || x >= gridW || y >= gridH) return;
  pixels[y][x] = value;
}

function linePixels(x0, y0, x1, y1, paint) {
  let dx = Math.abs(x1 - x0), sx = x0 < x1 ? 1 : -1;
  let dy = -Math.abs(y1 - y0), sy = y0 < y1 ? 1 : -1;
  let err = dx + dy;
  for (;;) {
    paint(x0, y0);
    if (x0 === x1 && y0 === y1) break;
    const e2 = 2 * err;
    if (e2 >= dy) { err += dy; x0 += sx; }
    if (e2 <= dx) { err += dx; y0 += sy; }
  }
}

function rectPixels(x0, y0, x1, y1, filled, paint) {
  const { x0: ax, y0: ay, x1: bx, y1: by } = normalized({ x0, y0, x1, y1 });
  if (filled) {
    for (let y = ay; y <= by; y += 1) for (let x = ax; x <= bx; x += 1) paint(x, y);
    return;
  }
  for (let x = ax; x <= bx; x += 1) { paint(x, ay); paint(x, by); }
  for (let y = ay; y <= by; y += 1) { paint(ax, y); paint(bx, y); }
}

function circlePixels(x0, y0, x1, y1, filled, paint) {
  const cx = (x0 + x1) / 2;
  const cy = (y0 + y1) / 2;
  const rx = Math.abs(x1 - x0) / 2;
  const ry = Math.abs(y1 - y0) / 2;
  for (let y = 0; y < gridH; y += 1) {
    for (let x = 0; x < gridW; x += 1) {
      const dx = rx === 0 ? (x - cx) : (x - cx) / rx;
      const dy = ry === 0 ? (y - cy) : (y - cy) / ry;
      const d = dx * dx + dy * dy;
      if (filled ? d <= 1 : Math.abs(d - 1) < Math.max(0.15, 1 / Math.max(rx, ry, 1)) * 1.4) paint(x, y);
    }
  }
}

function flood(x, y, from, to) {
  if (from === to) return;
  const stack = [[x, y]];
  while (stack.length) {
    const [cx, cy] = stack.pop();
    if (cx < 0 || cy < 0 || cx >= gridW || cy >= gridH) continue;
    if (pixels[cy][cx] !== from) continue;
    pixels[cy][cx] = to;
    stack.push([cx + 1, cy], [cx - 1, cy], [cx, cy + 1], [cx, cy - 1]);
  }
}

function paintCell(x, y) {
  if (tool === 'eraser') put(x, y, null);
  else if (tool === 'fill') flood(x, y, pixels[y][x], color);
  else if (tool === 'picker') {
    if (pixels[y][x]) { color = pixels[y][x]; document.getElementById('color').value = color; }
  } else put(x, y, color);
}

canvas.addEventListener('pointerdown', (event) => {
  const point = cell(event);
  if (!point) return;
  if (tool === 'select') {
    startPoint = point;
    selection = { x0: point.x, y0: point.y, x1: point.x, y1: point.y };
    drawing = true;
    render();
    return;
  }
  snapshot();
  drawing = true;
  startPoint = point;
  if (tool === 'line' || tool === 'rect' || tool === 'circle') {
    drawSnapshot = pixels.map((row) => row.slice());
    render();
    return;
  }
  paintCell(point.x, point.y);
  render();
});

canvas.addEventListener('pointermove', (event) => {
  if (!drawing) return;
  const point = cell(event);
  if (!point) return;
  if (tool === 'select') {
    selection.x1 = point.x;
    selection.y1 = point.y;
    render();
    return;
  }
  if (tool === 'line' || tool === 'rect' || tool === 'circle') {
    pixels = drawSnapshot.map((row) => row.slice());
    const filled = document.getElementById('filled').checked;
    const paint = (x, y) => put(x, y, color);
    if (tool === 'line') linePixels(startPoint.x, startPoint.y, point.x, point.y, paint);
    else if (tool === 'rect') rectPixels(startPoint.x, startPoint.y, point.x, point.y, filled, paint);
    else circlePixels(startPoint.x, startPoint.y, point.x, point.y, filled, paint);
    render();
    return;
  }
  paintCell(point.x, point.y);
  render();
});

window.addEventListener('pointerup', () => {
  drawing = false;
  startPoint = null;
  drawSnapshot = null;
});

function mark(id, ids) {
  for (const name of ids) document.getElementById(name).className = name === id ? 'active' : '';
}

const basic = ['pencil', 'eraser', 'fill', 'picker'];
const shapes = ['line', 'rect', 'circle', 'select'];
document.getElementById('pencil').onclick = () => { tool = 'pencil'; mark('pencil', basic.concat(shapes)); };
document.getElementById('eraser').onclick = () => { tool = 'eraser'; mark('eraser', basic.concat(shapes)); };
document.getElementById('fill').onclick = () => { tool = 'fill'; mark('fill', basic.concat(shapes)); };
document.getElementById('picker').onclick = () => { tool = 'picker'; mark('picker', basic.concat(shapes)); };
document.getElementById('line').onclick = () => { tool = 'line'; mark('line', basic.concat(shapes)); };
document.getElementById('rect').onclick = () => { tool = 'rect'; mark('rect', basic.concat(shapes)); };
document.getElementById('circle').onclick = () => { tool = 'circle'; mark('circle', basic.concat(shapes)); };
document.getElementById('select').onclick = () => { tool = 'select'; mark('select', basic.concat(shapes)); };

document.getElementById('color').oninput = (event) => { color = event.target.value; };

document.getElementById('size').onchange = (event) => {
  const [w, h] = String(event.target.value).split('x').map(Number);
  gridW = w;
  gridH = h;
  reset();
};

document.getElementById('template').onchange = (event) => {
  showTemplate = event.target.checked;
  render();
};

document.getElementById('gridToggle').onclick = (event) => {
  showGrid = !showGrid;
  event.target.className = showGrid ? 'active' : '';
  render();
};

document.getElementById('undo').onclick = () => {
  const previous = undoStack.pop();
  if (!previous) return;
  redoStack.push(pixels.map((row) => row.slice()));
  pixels = previous;
  render();
};
document.getElementById('redo').onclick = () => {
  const next = redoStack.pop();
  if (!next) return;
  undoStack.push(pixels.map((row) => row.slice()));
  pixels = next;
  render();
};
document.getElementById('clear').onclick = () => { snapshot(); reset(); };

function withSelection(action) {
  if (!selection) return;
  snapshot();
  action(normalized(selection));
  render();
}

function copySelection(cut) {
  withSelection(({ x0, y0, x1, y1 }) => {
    const width = x1 - x0 + 1;
    const height = y1 - y0 + 1;
    const data = [];
    for (let y = 0; y < height; y += 1) {
      const row = [];
      for (let x = 0; x < width; x += 1) row.push(pixels[y0 + y][x0 + x]);
      data.push(row);
    }
    clipboard = { width, height, data, x: x0, y: y0 };
    if (cut) {
      for (let y = y0; y <= y1; y += 1) for (let x = x0; x <= x1; x += 1) pixels[y][x] = null;
    }
  });
}

function pasteSelection() {
  if (!clipboard) return;
  const at = selection ? normalized(selection) : { x0: clipboard.x, y0: clipboard.y };
  snapshot();
  for (let y = 0; y < clipboard.height; y += 1) {
    for (let x = 0; x < clipboard.width; x += 1) {
      put(at.x0 + x, at.y0 + y, clipboard.data[y][x]);
    }
  }
  selection = { x0: at.x0, y0: at.y0, x1: at.x0 + clipboard.width - 1, y1: at.y0 + clipboard.height - 1 };
  render();
}

document.getElementById('copy').onclick = () => copySelection(false);
document.getElementById('cut').onclick = () => copySelection(true);
document.getElementById('paste').onclick = pasteSelection;
document.getElementById('del').onclick = () => withSelection(({ x0, y0, x1, y1 }) => {
  for (let y = y0; y <= y1; y += 1) for (let x = x0; x <= x1; x += 1) pixels[y][x] = null;
});
document.getElementById('deselect').onclick = () => { selection = null; render(); };

window.addEventListener('keydown', (event) => {
  if (event.ctrlKey && event.key.toLowerCase() === 'c') { event.preventDefault(); copySelection(false); }
  else if (event.ctrlKey && event.key.toLowerCase() === 'x') { event.preventDefault(); copySelection(true); }
  else if (event.ctrlKey && event.key.toLowerCase() === 'v') { event.preventDefault(); pasteSelection(); }
  else if (event.key === 'Delete' || event.key === 'Backspace') { event.preventDefault(); document.getElementById('del').click(); }
  else if (event.key === 'Escape') { selection = null; render(); }
});

document.getElementById('savePng').onclick = () => downloadPng();
document.getElementById('saveJson').onclick = () => downloadJson();

function downloadPng() {
  const out = document.createElement('canvas');
  out.width = gridW;
  out.height = gridH;
  const octx = out.getContext('2d');
  for (let y = 0; y < gridH; y += 1) {
    for (let x = 0; x < gridW; x += 1) {
      if (!pixels[y][x]) continue;
      octx.fillStyle = pixels[y][x];
      octx.fillRect(x, y, 1, 1);
    }
  }
  out.toBlob((blob) => {
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url;
    link.download = 'sprite-' + gridW + 'x' + gridH + '.png';
    link.click();
    URL.revokeObjectURL(url);
  });
}

function downloadJson() {
  const symbols = 'abcdefghijklmnopqrstuvwxyzABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789';
  const map = new Map();
  let next = 0;
  const rows = [];
  for (let y = 0; y < gridH; y += 1) {
    let line = '';
    for (let x = 0; x < gridW; x += 1) {
      const value = pixels[y][x];
      if (!value) { line += '.'; continue; }
      if (!map.has(value)) map.set(value, symbols[next++] || '?');
      line += map.get(value);
    }
    rows.push(line);
  }
  const palette = {};
  for (const [value, symbol] of map) palette[symbol] = value;
  const data = JSON.stringify({ rows, palette }, null, 2);
  const blob = new Blob([data], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement('a');
  link.href = url;
  link.download = 'sprite-' + gridW + 'x' + gridH + '.json';
  link.click();
  URL.revokeObjectURL(url);
}

document.getElementById('zoomIn').onclick = () => setZoom(zoom + 2);
document.getElementById('zoomOut').onclick = () => setZoom(zoom - 2);
document.getElementById('zoomFit').onclick = () => setZoom(fitZoom());

canvas.addEventListener('wheel', (event) => {
  if (!event.ctrlKey && !event.metaKey) return;
  event.preventDefault();
  setZoom(zoom + (event.deltaY < 0 ? 1 : -1));
}, { passive: false });

window.addEventListener('keydown', (event) => {
  if (event.key === '+' || event.key === '=') { event.preventDefault(); setZoom(zoom + 1); }
  if (event.key === '-') { event.preventDefault(); setZoom(zoom - 1); }
  if (event.key === '0') { event.preventDefault(); setZoom(fitZoom()); }
});

const swatches = document.getElementById('swatches');
for (const value of PALETTE) {
  const cellEl = document.createElement('div');
  cellEl.className = 'swatch';
  cellEl.style.background = value;
  cellEl.onclick = () => {
    color = value;
    document.getElementById('color').value = value;
    for (const child of swatches.children) child.className = 'swatch';
    cellEl.className = 'swatch active';
  };
  swatches.append(cellEl);
}

reset();
</script>
</body>
</html>
