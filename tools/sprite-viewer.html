<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Спрайт — просмотр</title>
<style>
  body { margin:0; background:#0b0f18; color:#e6edf7; font:14px system-ui,sans-serif; padding:20px; }
  .row { display:flex; gap:24px; align-items:flex-end; flex-wrap:wrap; }
  .box { background:#1a2233; border:1px solid #26324a; border-radius:12px; padding:16px; display:flex; align-items:flex-end; gap:12px; }
  .light { background:#e9dfc8; }
  .floor { background:#d9c9a3; }
  img { image-rendering: pixelated; }
  .cap { font-size:12px; color:#8b98ad; margin-top:6px; }
</style></head>
<body>
<h1>Руководитель — 24×48</h1>
<div class="row">
  <div><div class="box"><img src="manager-preview.png" width="24" height="48"></div><div class="cap">1× (как в офисе)</div></div>
  <div><div class="box"><img src="manager-preview.png" width="72" height="144"></div><div class="cap">3×</div></div>
  <div><div class="box"><img src="manager-preview.png" width="144" height="288"></div><div class="cap">6×</div></div>
  <div><div class="box floor"><img src="manager-preview.png" width="144" height="288"></div><div class="cap">на полу офиса</div></div>
</div>
</body></html>
