<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><title>Спрайты отдела</title>
<style>
  body { margin:0; background:#0b0f18; color:#e6edf7; font:14px system-ui,sans-serif; padding:20px; }
  .row { display:flex; gap:18px; flex-wrap:wrap; }
  .card { background:#1a2233; border:1px solid #26324a; border-radius:12px; padding:12px; text-align:center; }
  .card img { image-rendering:pixelated; display:block; margin:0 auto; }
  .name { font-size:12px; color:#8b98ad; margin-top:6px; }
</style></head>
<body>
<h1>Спрайты отдела — 24×48</h1>
<div class="row" id="row"></div>
<script>
const roles = [['manager','руководитель'],['coder','кодер'],['tester','тестер'],['reviewer','ревьюер'],['artist','художник']];
const row = document.getElementById('row');
for (const [key, label] of roles) {
  const card = document.createElement('div');
  card.className = 'card';
  const img = document.createElement('img');
  img.src = key + '-preview.png';
  img.width = 120; img.height = 240;
  card.append(img);
  const name = document.createElement('div');
  name.className = 'name';
  name.textContent = label;
  card.append(name);
  row.append(card);
}
</script>
</body></html>
